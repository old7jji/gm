<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GM Ambient Scene</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05020a;
      font-family: system-ui, -apple-system, sans-serif;
    }

   
    .room {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #2a083b 0%, #12031c 55%, #05010a 90%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

   
    .center-logo-container {
      position: absolute;
      z-index: 10;
      text-align: center;
      pointer-events: none;
      animation: logoAppear 1.4s cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    .love-message {
      position: absolute;
      z-index: 11;
      top: 50%;
      right: 19%;
      width: 18%;
      color: #54205f;
      font-family: 'Great Vibes', 'Times New Roman', serif;
      font-size: 22px;
      line-height: 1.8;
      text-align: center;
      text-shadow: 0 1px 3px #05010a, 0 0 12px rgba(76, 24, 92, 0.65);
      transform: translateY(-50%);
      opacity: 0;
      animation: messageAppear 1.5s ease-out 1s forwards;
      pointer-events: none;
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        translate: 0 14px;
      }
      to {
        opacity: 1;
        translate: 0 0;
      }
    }

    @media (max-width: 700px) {
      .love-message {
        right: 17%;
        width: 28%;
        font-size: 16px;
        line-height: 1.65;
      }
    }

    @keyframes logoAppear {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.72);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .gm-monogram {
      font-family: 'Cinzel Decorative', 'Great Vibes', serif;
      font-size: 11rem;
      font-weight: 700;
      color: #8b0000;
      text-shadow: 
        0 0 10px #8b0000,
        0 0 20px #660000,
        0 0 40px #4a0000,
        0 0 70px #ff0000;
      letter-spacing: -15px;
      line-height: 1;
      animation: pulseGlow 4s ease-in-out infinite alternate;
      user-select: none;
    }

    @keyframes pulseGlow {
      0% {
        text-shadow: 0 0 10px #8b0000, 0 0 20px #660000, 0 0 35px #4a0000;
        transform: scale(0.99);
      }
      100% {
        text-shadow: 0 0 15px #a70000, 0 0 30px #8b0000, 0 0 50px #ff0000;
        transform: scale(1.02);
      }
    }

   
    .flowers-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .flower {
      position: absolute;
      transform-origin: center bottom;
      animation: flowerAppear 1.15s cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    @keyframes flowerAppear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.25) rotate(-24deg);
      }
      to {
        opacity: var(--flower-opacity, 1);
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flower,
      .center-logo-container,
      .love-message {
        animation: none;
        opacity: 1;
      }
    }

   
    .flower-main {
      bottom: 25%;
      left: 15%;
      width: 220px;
      height: 220px;
      filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.4));
    }

   
    .flower-top-1 { top: 2%; left: 20%; width: 90px; height: 90px; --flower-opacity: 0.8; animation-delay: 0.25s; }
    .flower-top-2 { top: 2%; left: 38%; width: 100px; height: 100px; --flower-opacity: 0.85; animation-delay: 0.4s; }
    .flower-top-3 { top: 2%; right: 38%; width: 90px; height: 90px; --flower-opacity: 0.8; animation-delay: 0.55s; }
    .flower-top-4 { top: 1%; right: 25%; width: 110px; height: 110px; --flower-opacity: 0.9; animation-delay: 0.7s; }
    .flower-gap-left-top { top: 25%; left: 4%; width: 72px; height: 72px; --flower-opacity: 0.78; animation-delay: 0.85s; }
    .flower-gap-top-center { top: 2%; left: 52%; width: 78px; height: 78px; --flower-opacity: 0.82; animation-delay: 1s; }
    .flower-gap-right-top { top: 24%; right: 4%; width: 72px; height: 72px; --flower-opacity: 0.78; animation-delay: 1.15s; }
    .flower-gap-left-middle { top: 58%; left: 3%; width: 68px; height: 68px; --flower-opacity: 0.75; animation-delay: 1.3s; }
    .flower-gap-right-middle { top: 58%; right: 3%; width: 68px; height: 68px; --flower-opacity: 0.75; animation-delay: 1.45s; }
    .flower-gap-bottom-left { bottom: 4%; left: 32%; width: 74px; height: 74px; --flower-opacity: 0.8; animation-delay: 1.6s; }
    .flower-gap-bottom-right { bottom: 4%; right: 30%; width: 74px; height: 74px; --flower-opacity: 0.8; animation-delay: 1.75s; }
    .flower-gap-right-upper { top: 41%; right: 11%; width: 68px; height: 68px; --flower-opacity: 0.76; animation-delay: 1.9s; }
    .flower-gap-right-lower { top: 77%; right: 11%; width: 70px; height: 70px; --flower-opacity: 0.78; animation-delay: 2.05s; }

   
    .stem {
      position: absolute;
      background: linear-gradient(to top, #0f0318, #3b0f54, #6b21a8);
      border-radius: 4px;
    }

    .main-stem {
      bottom: 0;
      left: calc(15% + 106px);
      width: 8px;
      height: 30%;
    }

    .bg-stem-1 { bottom: 0; left: 23%; width: 4px; height: 90%; }
    .bg-stem-2 { bottom: 0; left: 41%; width: 4px; height: 90%; }
    .bg-stem-3 { bottom: 0; right: 41%; width: 4px; height: 90%; }
    .bg-stem-4 { bottom: 0; right: 28%; width: 5px; height: 92%; }

    .heart {
      position: absolute;
      background-color: #a855f7;
      display: inline-block;
      height: 10px;
      width: 10px;
      transform: rotate(-45deg);
      opacity: 0.6;
      animation: floatUp 6s ease-in infinite;
      filter: drop-shadow(0 0 5px #c084fc);
    }

    .heart:before, .heart:after {
      content: "";
      background-color: #a855f7;
      border-radius: 50%;
      height: 10px;
      position: absolute;
      width: 10px;
    }

    .heart:before { top: -5px; left: 0; }
    .heart:after { left: 5px; top: 0; }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(-45deg) scale(0.6);
        opacity: 0;
      }
      50% { opacity: 0.8; }
      100% {
        transform: translateY(-120px) rotate(-45deg) scale(1.1);
        opacity: 0;
      }
    }

   
    .top-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
    }

    .sound-toggle {
      background: rgba(20, 5, 30, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #d8b4fe;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .sound-toggle:hover {
      background: rgba(168, 85, 247, 0.2);
      border-color: #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <main class="room" id="room">
   
    <div class="center-logo-container">
      <div class="gm-monogram">GM</div>
    </div>

    <p class="love-message" lang="ar">
      أنتِ لي أمل وأنتِ لي روح<br>
      بكِ تكتمل دُنياي وبكِ أحيا
    </p>

   
    <div class="flowers-container">
      <div class="stem main-stem"></div>
      <div class="stem bg-stem-1"></div>
      <div class="stem bg-stem-2"></div>
      <div class="stem bg-stem-3"></div>
      <div class="stem bg-stem-4"></div>

     
      <svg class="flower flower-main" viewBox="0 0 100 100">
        <defs>
          <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f3e8ff" />
            <stop offset="40%" stop-color="#c084fc" />
            <stop offset="85%" stop-color="#7e22ce" />
            <stop offset="100%" stop-color="#3b0764" />
          </radialGradient>
        </defs>
        <g transform="translate(50,50)">
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(60)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(120)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(180)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(240)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(300)" />
          <circle cx="0" cy="0" r="10" fill="#f3e8ff" filter="drop-shadow(0 0 6px #fff)" />
        </g>
      </svg>

     
      <svg class="flower flower-top-1" viewBox="0 0 100 100">
        <g transform="translate(50,50)">
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(60)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(120)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(180)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(240)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(300)" />
          <circle cx="0" cy="0" r="8" fill="#f3e8ff" />
        </g>
      </svg>

      <svg class="flower flower-top-2" viewBox="0 0 100 100">
        <g transform="translate(50,50)">
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(60)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(120)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(180)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(240)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(300)" />
          <circle cx="0" cy="0" r="8" fill="#f3e8ff" />
        </g>
      </svg>

      <svg class="flower flower-top-3" viewBox="0 0 100 100">
        <g transform="translate(50,50)">
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(60)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(120)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(180)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(240)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(300)" />
          <circle cx="0" cy="0" r="8" fill="#f3e8ff" />
        </g>
      </svg>

      <svg class="flower flower-top-4" viewBox="0 0 100 100">
        <g transform="translate(50,50)">
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(60)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(120)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(180)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(240)" />
          <path d="M 0 0 C -15 -30 -25 -45 0 -50 C 25 -45 15 -30 0 0" fill="url(#purpleGlow)" transform="rotate(300)" />
          <circle cx="0" cy="0" r="8" fill="#f3e8ff" />
        </g>
      </svg>
    </div>

   
    <div id="heartsContainer"></div>

   
    <header class="top-controls">
      <button class="sound-toggle" id="soundToggle" aria-label="Toggle Sound Effects" title="Sound Effects (ON/OFF)">
        <svg class="sound-icon sound-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08"></path>
        </svg>
        <svg class="sound-icon sound-off hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </header>
  </main>

  <script>
   
    const heartsContainer = document.getElementById('heartsContainer');
    
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      
      const startX = Math.random() > 0.5 ? (12 + Math.random() * 15) : (55 + Math.random() * 15);
      const startY = 40 + Math.random() * 40;
      const size = 6 + Math.random() * 8;
      const duration = 4 + Math.random() * 5;

      heart.style.left = startX + '%';
      heart.style.top = startY + '%';
      heart.style.width = size + 'px';
      heart.style.height = size + 'px';
      heart.style.animationDuration = duration + 's';

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    const flowersContainer = document.querySelector('.flowers-container');
    const flowerPositions = [
      'flower-gap-left-top',
      'flower-gap-top-center',
      'flower-gap-right-top',
      'flower-gap-left-middle',
      'flower-gap-right-middle',
      'flower-gap-bottom-left',
      'flower-gap-bottom-right',
      'flower-gap-right-upper',
      'flower-gap-right-lower'
    ];

    flowerPositions.forEach((position) => {
      const flower = document.querySelector('.flower-top-1').cloneNode(true);
      flower.classList.remove('flower-top-1');
      flower.classList.add(position);
      flower.setAttribute('aria-hidden', 'true');
      flowersContainer.appendChild(flower);
    });

    setInterval(createHeart, 400);

   
    const soundBtn = document.getElementById('soundToggle');
    const soundOn = soundBtn.querySelector('.sound-on');
    const soundOff = soundBtn.querySelector('.sound-off');

    soundBtn.addEventListener('click', () => {
      soundOn.classList.toggle('hidden');
      soundOff.classList.toggle('hidden');
    });
  </script>
</body>
</html>
